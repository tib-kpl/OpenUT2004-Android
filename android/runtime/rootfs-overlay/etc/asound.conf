# Sortie audio du runtime : PCM brut S16_LE stereo 48 kHz ecrit dans un FIFO,
# lu par l'appli Android (AudioTrack). Le FIFO bloquant cadence le mixage.
pcm.!default {
    type plug
    slave {
        pcm "appfifo"
        format S16_LE
        rate 48000
        channels 2
    }
}

pcm.appfifo {
    type file
    slave.pcm "null"
    file "/tmp/audio.fifo"
    format "raw"
}
